name: 1440TIME Heat Engine

on:
  schedule:
    - cron: "*/30 13-21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: heat-engine
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas numpy yfinance
      - name: Run Heat Engine
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/heat_engine.py --force
          else
            python scripts/heat_engine.py
          fi
      - name: Commit updated scores
        run: |
          git config user.name "1440TIME Heat Engine"
          git config user.email "actions@users.noreply.github.com"
          git add data/heat.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Heat Engine update $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')"
          git pull --rebase origin main
          git push
