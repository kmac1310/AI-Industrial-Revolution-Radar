name: 1440TIME Heat Engine

on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas numpy yfinance
      - name: Run Heat Engine
        run: python scripts/heat_engine.py
      - name: Commit updated scores
        run: |
          git config user.name "1440TIME Heat Engine"
          git config user.email "actions@users.noreply.github.com"
          git add data/heat.json
          git diff --cached --quiet || git commit -m "Heat Engine update $(date -u +%Y-%m-%d)"
          git push
